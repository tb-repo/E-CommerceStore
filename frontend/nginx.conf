server {
    listen 80;
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        default_type application/json;
        return 200 '{"service": "Frontend Service", "status": "Live", "message": "Frontend is Live"}';
    }

    # Microservice Reverse Proxies
    location /api/auth {
        proxy_pass http://user-service:3001;
    }
    location /api/users {
        proxy_pass http://user-service:3001;
    }
    location /api/products {
        proxy_pass http://product-service:3002;
    }
    location /api/categories {
        proxy_pass http://product-service:3002;
    }
    location /api/cart {
        proxy_pass http://cart-service:3003;
    }
    location /api/orders {
        proxy_pass http://order-service:3004;
    }
    location /api/payments {
        proxy_pass http://order-service:3004;
    }
}